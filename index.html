<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo Tugas Sekolah</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📚 Todo Tugas Sekolah</h1>
            <p class="subtitle">Kelola tugas sekolahmu dengan efisien</p>
        </header>

        <main>
            <div class="input-section">
                <div class="input-group">
                    <input 
                        type="text" 
                        id="taskInput" 
                        placeholder="Masukkan tugas baru..."
                        class="task-input"
                    >
                    <input 
                        type="text" 
                        id="tagInput" 
                        placeholder="Tag (pisahkan dengan koma)"
                        class="tag-input"
                    >
                    <input 
                        type="date" 
                        id="deadlineInput" 
                        class="deadline-input"
                        title="Pilih deadline tugas"
                    >
                    <button id="addBtn" class="add-btn">+ Tambah</button>
                </div>
            </div>

            <div class="filter-section">
                <button class="filter-btn active" data-filter="all">Semua</button>
                <button class="filter-btn" data-filter="active">Aktif</button>
                <button class="filter-btn" data-filter="completed">Selesai</button>
            </div>

            <div class="tag-filter-section" id="tagFilterSection">
                <p class="tag-filter-label">Filter Tag:</p>
                <div id="tagFilterContainer" class="tag-filter-container">
                    <button class="tag-filter-btn active" data-tag="all">Semua Tag</button>
                </div>
            </div>

            <div class="tasks-section">
                <ul id="taskList" class="task-list">
                    <!-- Tugas akan ditambahkan di sini -->
                </ul>
                <div id="emptyState" class="empty-state">
                    <p>📭 Tidak ada tugas. Mulai tambahkan tugas baru!</p>
                </div>
            </div>

            <div class="stats-section">
                <div class="stat">
                    <span class="stat-label">Total:</span>
                    <span id="totalCount" class="stat-value">0</span>
                </div>
                <div class="stat">
                    <span class="stat-label">Selesai:</span>
                    <span id="completedCount" class="stat-value">0</span>
                </div>
                <div class="stat">
                    <span class="stat-label">Sisa:</span>
                    <span id="remainingCount" class="stat-value">0</span>
                </div>
            </div>

            <button id="clearBtn" class="clear-btn">🗑️ Hapus Tugas Selesai</button>
        </main>

        <footer>
            <p>&copy; 2024 Todo Tugas Sekolah | Buatan Sendiri</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
